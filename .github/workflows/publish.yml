name: publish

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  # Publishing lives in this file because npm trusted publishing is bound to
  # publish.yml. A release created by release-please with GITHUB_TOKEN does not
  # fire the `release` event, so the push run publishes it here instead.
  publish:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'release' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Secrets can't be read in a step `if`, so the Slack steps test this copy.
      # While the secret is unset, both notices are skipped.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
    steps:
      # Overlapping pushes can make a later run create an earlier release, so
      # build the tagged commit rather than the commit that triggered this run.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Notify Slack of the published version
        if: ${{ success() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v2.0.0-rc.3
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Node SDK ${{ steps.version.outputs.version }} published to npm",
              "channel": "#server-sdk-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Node* SDK ${{ steps.version.outputs.version }} published to npm. <https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}|View release>"
                  }
                }
              ]
            }

      - name: Notify Slack of a failed release
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v2.0.0-rc.3
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Node SDK release failure",
              "channel": "#server-sdk-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Node* SDK release :warning: failure :warning:\nView the <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|run logs> to see why."
                  }
                }
              ]
            }
